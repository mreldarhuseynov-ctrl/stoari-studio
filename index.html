<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo/avatar-512.png" />

    <title>STOARI — Architectural Visualisation &amp; Film, Costa del Sol</title>
    <meta
      name="description"
      content="Visualisation, property film, drone and the project page — one studio for everything that sells a villa, an apartment or a development on the Costa del Sol."
    />
    <link rel="canonical" href="https://bespoke-bombolone-459790.netlify.app/" />

    <!-- The link preview is the first thing a developer sees when this URL
         arrives in a DM, so it carries the most explanatory frame the studio
         has: a real plot at night with the building footprint drawn on it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STOARI" />
    <meta property="og:url" content="https://bespoke-bombolone-459790.netlify.app/" />
    <meta property="og:title" content="STOARI — see the building before it is built" />
    <meta
      property="og:description"
      content="Visualisation, property film, drone and the project page. One studio, one look. Costa del Sol."
    />
    <meta property="og:image" content="https://bespoke-bombolone-459790.netlify.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A plot at night from the air with the building footprint drawn onto the ground in light"
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STOARI — see the building before it is built" />
    <meta
      name="twitter:description"
      content="Visualisation, property film, drone and the project page. One studio, one look."
    />
    <meta name="twitter:image" content="https://bespoke-bombolone-459790.netlify.app/og.jpg" />
      <!-- Bahnschrift is the approved wordmark face but ships only with Windows.
         Archivo is the DIN descendant named as its fallback in START-HERE.md —
         loading it means a visitor on a Mac or a phone sees the same letterforms
         rather than whatever generic sans the system picks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cormorant Garamond sets the headings. The body stays monospace: that
         is the studio's voice and the contrast between the two is the point —
         a serif everywhere would read as any other property site. Cyrillic is
         not optional, the site has a Russian version, and Archivo has no
         Cyrillic at all; Cormorant does. `display=swap` so the headings are
         never invisible while it loads. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400&family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Netlify reads the form at deploy time from the static HTML, not from
         anything React renders. This copy exists only to be read: the visible
         form lives in App.tsx and posts to it. Add a field there and add it
         here too, or that field silently never arrives. -->
    <form name="enquiry" netlify netlify-honeypot="bot-field" hidden>
      <!-- The honeypot is named in the attribute above and filled by the React
           form, but it has to exist here too: this copy is the one Netlify
           reads, and a field missing from it is a field that never arrives —
           which is the rule stated right above, applied to itself. -->
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="text" name="object" />
      <input type="text" name="when" />
    </form>
  </body>
</html>
