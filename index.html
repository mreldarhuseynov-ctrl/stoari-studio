  <body>
    <noscript><div class="noscript"><h1>STOARI — Property video &amp; photography in Marbella</h1><p>Film, photography, drone and social media for estate agents and developers on the Costa del Sol.</p><p>Contact: <a href="mailto:info@stoari.com">info@stoari.com</a> · <a href="tel:+34610826619">+34 610 826 619</a></p><a href="/privacy/">Privacy</a> · <a href="/legal/">Legal notice</a> · <a href="/cookies/">Cookies</a></div></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Netlify reads the form at deploy time from the static HTML, not from
         anything React renders. This copy exists only to be read: the visible
         form lives in App.tsx and posts to it. Add a field there and add it
         here too, or that field silently never arrives. -->
    <form name="enquiry" netlify netlify-honeypot="bot-field" hidden>
      <!-- The honeypot is named in the attribute above and filled by the React
           form, but it has to exist here too: this copy is the one Netlify
           reads, and a field missing from it is a field that never arrives —
           which is the rule stated right above, applied to itself. -->
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="object" />
      <input type="text" name="when" />
    </form>
  </body>
